name: Inspect RO App public request transport source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-roapp-fetchrequest-source.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract relevant original sources from public source maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import urllib.parse
          import urllib.request

          HEADERS = {
              "User-Agent": "Mozilla/5.0 Chrome/126 Safari/537.36",
              "Accept": "text/html,application/javascript,application/json,*/*",
          }

          def fetch(url, cap=50_000_000):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=35) as response:
                  return response.geturl(), response.read(cap)

          root, page_bytes = fetch("https://web.roapp.io/login", 5_000_000)
          page = page_bytes.decode("utf-8", "replace")
          scripts = [
              urllib.parse.urljoin(root, html.unescape(value))
              for value in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', page, re.I)
          ]
          scripts = list(dict.fromkeys(scripts))

          needles = [
              "fetchRequest",
              "/integrations/service/vin-lookup",
              "VIN_LOOKUP",
              "credentials:",
              "X-CSRF",
              "Authorization",
              "API_HOST",
              "API_URL",
          ]

          def inspect(script_url):
              rows = []
              try:
                  _, js_bytes = fetch(script_url, 20_000_000)
                  js = js_bytes.decode("utf-8", "replace")
              except Exception as error:
                  return rows

              map_urls = [script_url + ".map"]
              source_map_match = re.search(r"sourceMappingURL=([^\s*]+)", js[-1500:])
              if source_map_match:
                  map_urls.insert(0, urllib.parse.urljoin(script_url, source_map_match.group(1).strip()))

              seen_maps = set()
              for map_url in map_urls:
                  if map_url in seen_maps:
                      continue
                  seen_maps.add(map_url)
                  try:
                      _, map_bytes = fetch(map_url, 80_000_000)
                      source_map = json.loads(map_bytes.decode("utf-8", "replace"))
                  except Exception:
                      continue
                  sources = source_map.get("sources") or []
                  contents = source_map.get("sourcesContent") or []
                  for index, content in enumerate(contents):
                      if not isinstance(content, str):
                          continue
                      matched = [needle for needle in needles if needle.lower() in content.lower()]
                      if not matched:
                          continue
                      # Keep only files likely to describe networking/config/VIN behavior.
                      source_name = sources[index] if index < len(sources) else f"source-{index}"
                      lower_name = source_name.lower()
                      lower_content = content.lower()
                      relevant = (
                          "fetchrequest" in lower_content
                          or "/integrations/service/vin-lookup" in lower_content
                          or "request" in lower_name
                          or "api" in lower_name
                          or "config" in lower_name
                          or "integration" in lower_name
                      )
                      if relevant:
                          rows.append({
                              "script": script_url,
                              "map": map_url,
                              "source": source_name,
                              "matched": matched,
                              "content": content[:200_000],
                          })
              return rows

          rows = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              for group in executor.map(inspect, scripts):
                  rows.extend(group)

          # Deduplicate by source name + content prefix.
          unique = []
          seen = set()
          for row in rows:
              key = (row["source"], row["content"][:500])
              if key in seen:
                  continue
              seen.add(key)
              unique.append(row)

          output = {
              "page": root,
              "script_count": len(scripts),
              "matched_sources": len(unique),
              "sources": unique[:80],
          }
          with open("tmp/roapp-fetchrequest-sources.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)
          if not unique:
              raise SystemExit("No relevant source-map content found")
          PY

      - name: Publish result and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-fetchrequest-sources.json
          git rm -f .github/workflows/extract-roapp-fetchrequest-source.yml
          git commit -m "Record RO App public request transport sources"
          git pull --rebase origin main
          git push origin HEAD:main
