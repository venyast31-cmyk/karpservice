name: Fix RO App asset array query parameters

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-roapp-asset-array-params.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply fix
        run: python scripts/fix_roapp_asset_array_params.py

      - name: Verify Worker and regression test
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix worker run check
          npm --prefix worker test
          grep -Fq 'searchParams.append("uid[]", vin)' worker/src/index.js
          grep -Fq 'searchParams.append("owner_id[]", String(customerId))' worker/src/index.js

      - name: Publish fix and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/test/worker-security.test.mjs
          git rm -f .github/workflows/fix-roapp-asset-array-params.yml
          git rm -f scripts/fix_roapp_asset_array_params.py
          git rm -f tmp/roapp-asset-research.txt tmp/roapp-get-assets-research.txt || true
          git commit -m "Fix RO App asset array query parameters"
          git push origin HEAD:main
