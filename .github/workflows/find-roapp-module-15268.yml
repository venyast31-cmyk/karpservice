name: Find RO App module 15268 exactly

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/find-roapp-module-15268.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Search every current bundle for exact module IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import concurrent.futures, html, re, urllib.parse, urllib.request

          H={'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Accept':'text/html,application/javascript,*/*'}
          def get(url,cap=15_000_000):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.geturl(),r.read(cap).decode('utf-8','replace')

          root,page=get('https://web.roapp.io/login',5_000_000)
          urls=[urllib.parse.urljoin(root,html.unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I)]

          # Current numeric lazy chunks from the webpack runtime.
          runtime_urls=[u for u in urls if '91137.' in u or 'start~35c7f2b5' in u]
          for ru in runtime_urls:
              try: _,runtime=get(ru,5_000_000)
              except Exception: continue
              m=re.search(r'\.u=function\([^)]*\)\{return[\s\S]*?\{(.*?)\}\[[^\]]+\]\+"\\?\.js"\}',runtime)
              if m:
                  base=urllib.parse.urljoin(ru,'./')
                  urls.extend(urllib.parse.urljoin(base,f'{a}.{b}.js') for a,b in re.findall(r'(\d+):"([a-f0-9]+)"',m.group(1)))
          urls=sorted(set(u for u in urls if urllib.parse.urlsplit(u).netloc=='web.roapp.io'))

          needles=['15268','61998','83454']
          def inspect(url):
              try: final,body=get(url)
              except Exception: return []
              rows=[]
              for needle in needles:
                  positions=[m.start() for m in re.finditer(needle,body)]
                  if not positions: continue
                  for pos in positions[:80]:
                      left=max(0,pos-600)
                      right=min(len(body),pos+5000)
                      rows.append((final,needle,pos,body[left:right]))
              return rows

          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              for group in ex.map(inspect,urls): rows.extend(group)

          out=[f'URLS={len(urls)} ROWS={len(rows)}']
          for final,needle,pos,snippet in rows:
              out.append(f'\n===== NEEDLE {needle} SOURCE {final} POS {pos} =====\n{snippet}')
          open('tmp/roapp-module-id-context.txt','w',encoding='utf-8').write('\n'.join(out)[:1_200_000])
          if not rows: raise SystemExit('No module ID occurrences found')
          PY

      - name: Publish and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-module-id-context.txt
          git rm -f .github/workflows/find-roapp-module-15268.yml
          git commit -m "Record RO App module ID contexts"
          git push origin HEAD:main
