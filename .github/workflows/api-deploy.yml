name: Deploy Karpservice API
on:
  # Only an explicit release branch push deploys; preparation branches do not.
  push:
    branches: ['release/api']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: karpservice-api-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'venyast31-cmyk/karpservice' && github.ref == 'refs/heads/release/api'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and isolated tests
        run: |
          npm run check
          npm test
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - name: Apply additive database migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.127.1 d1 migrations apply karpservice-auth --remote
          npx --yes wrangler@4.127.1 deploy
      - name: Check public health without customer actions
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://karpservice-api.venyast31.workers.dev/health');
          const health = await response.json();
          if (!response.ok || !health.success || !health.telegram_configured || !health.telegram_auth_configured) {
            throw new Error('Worker health/configuration check failed; inspect deployment before the iOS release');
          }
          console.log('Worker health passed. Customer deletion delivery still requires controlled verification.');
          JS
