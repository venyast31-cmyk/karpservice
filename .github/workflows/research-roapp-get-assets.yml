name: Research RO App get assets query encoding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-roapp-get-assets.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Query indexed RO App documentation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 40 \
            'https://context7.com/api/v2/context?libraryId=%2Fwebsites%2Froapp_readme_io&query=Get%20Assets%20GET%20warehouse%20assets%20uid%20owner_id%20array%20query%20parameter%20encoding%20request%20example&type=txt' \
            > tmp/roapp-get-assets-research.txt
      - name: Publish result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-get-assets-research.txt
          git rm -f .github/workflows/research-roapp-get-assets.yml
          git commit -m "Capture RO App asset query encoding research"
          git push origin HEAD:main
