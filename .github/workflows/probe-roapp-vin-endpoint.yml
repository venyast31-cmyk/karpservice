name: Probe RO App VIN endpoint variants

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-roapp-vin-endpoint.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Call deployed diagnostic variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          variants = [
              "api_v2_get_bearer",
              "api_get_bearer",
              "api_v2_get_query",
              "api_get_query",
              "api_v2_post_bearer_json",
              "api_post_bearer_form",
              "web_get_bearer",
              "web_post_bearer_form",
              "remonline_api_get_bearer",
              "remonline_web_get_bearer",
          ]
          results = []
          for variant in variants:
              url = "https://karpservice-api.venyast31.workers.dev/health/roapp-vin-lookup?" + urllib.parse.urlencode({"variant": variant})
              try:
                  request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "Karpservice diagnostic"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      results.append(json.loads(response.read().decode("utf-8")))
              except Exception as error:
                  results.append({"variant": variant, "probe_error": repr(error)})
              time.sleep(1.0)
          open("tmp/roapp-vin-endpoint-results.json", "w", encoding="utf-8").write(
              json.dumps(results, ensure_ascii=False, indent=2)
          )
          PY
          python -m json.tool tmp/roapp-vin-endpoint-results.json >/dev/null

      - name: Publish results and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-vin-endpoint-results.json
          git rm -f .github/workflows/probe-roapp-vin-endpoint.yml
          git commit -m "Record RO App VIN endpoint diagnostics"
          git push origin HEAD:main
