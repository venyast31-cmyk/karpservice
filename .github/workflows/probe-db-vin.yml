name: Probe free DB.VIN decoder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-db-vin.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Query DB.VIN for European test VINs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          from pathlib import Path
          import json
          import urllib.request
          import urllib.error

          vins = ["TMBDX41U79B008586", "JMBSRCS3A6U011108"]
          results = []
          for vin in vins:
              url = f"https://db.vin/api/v1/vin/{vin}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Karpservice/1.0",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      raw = response.read(2_000_000).decode("utf-8", "replace")
                      try:
                          data = json.loads(raw)
                      except Exception:
                          data = raw[:2000]
                      results.append({
                          "vin": vin,
                          "status": response.status,
                          "content_type": response.headers.get("content-type", ""),
                          "data": data,
                      })
              except urllib.error.HTTPError as error:
                  raw = error.read(2_000_000).decode("utf-8", "replace")
                  try:
                      data = json.loads(raw)
                  except Exception:
                      data = raw[:2000]
                  results.append({"vin": vin, "status": error.code, "data": data})
              except Exception as error:
                  results.append({"vin": vin, "status": 0, "error": type(error).__name__ + ": " + str(error)})

          Path("tmp/db-vin-probe.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Publish result and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/db-vin-probe.json
          git rm -f .github/workflows/probe-db-vin.yml
          git commit -m "Record DB.VIN decoder probe"
          git pull --rebase origin main
          git push origin HEAD:main
