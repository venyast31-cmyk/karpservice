name: Inspect Apple authentication schema
on:
  push:
    branches: ['fix/auth-diagnostics']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read authentication table schema only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const env=process.env;
          const url='https://api.cloudflare.com/client/v4/accounts/'+env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/e7568dec-237a-4f1d-b8eb-fd1170af09e9/query';
          for(const table of ['apple_accounts','apple_sessions','apple_challenges','apple_phone_verifications']){
            const res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql:'PRAGMA table_info('+table+')'})});
            const data=await res.json();
            console.log(JSON.stringify({table,status:res.status,success:data.success,columns:data.result?.[0]?.results?.map(x=>({name:x.name,type:x.type,required:x.notnull,pk:x.pk}))}));
            if(!res.ok||!data.success)throw new Error('Schema inspection failed');
          }
          JS
