name: Probe official vPIC VIN decoder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vpic-vin.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Query official NHTSA vPIC API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          vins = [
              "TMBDX41U79B008586",
              "JMBSRCS3A6U011108",
          ]
          output = []
          for vin in vins:
              url = "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/" + urllib.parse.quote(vin) + "?format=json"
              request = urllib.request.Request(url, headers={"User-Agent": "Karpservice/1.0", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  row = (data.get("Results") or [{}])[0]
                  output.append({
                      "vin": vin,
                      "status": 200,
                      "make": row.get("Make"),
                      "model": row.get("Model"),
                      "model_year": row.get("ModelYear"),
                      "series": row.get("Series"),
                      "trim": row.get("Trim"),
                      "body_class": row.get("BodyClass"),
                      "fuel_type": row.get("FuelTypePrimary"),
                      "displacement_l": row.get("DisplacementL"),
                      "doors": row.get("Doors"),
                      "error_code": row.get("ErrorCode"),
                      "error_text": row.get("ErrorText"),
                      "manufacturer": row.get("Manufacturer"),
                  })
              except Exception as error:
                  output.append({"vin": vin, "error": type(error).__name__ + ": " + str(error)})

          with open("tmp/vpic-vin-results.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)
          PY

      - name: Publish result and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/vpic-vin-results.json
          git rm -f .github/workflows/probe-vpic-vin.yml
          git commit -m "Record official vPIC VIN decoder result"
          git pull --rebase origin main
          git push origin HEAD:main
