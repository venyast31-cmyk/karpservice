name: Fix RO App asset endpoint compatibility

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-roapp-asset-endpoint.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply RO App asset endpoint fallback
        run: python scripts/fix_roapp_asset_endpoint.py

      - name: Verify Worker
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix worker run check
          npm --prefix worker test
          grep -q 'ROAPP_ASSET_BASES' worker/src/index.js
          grep -q 'roappAssetRequest' worker/src/index.js
          grep -q 'https://api.roapp.io/warehouse/assets' worker/src/index.js

      - name: Publish fix and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git rm -f .github/workflows/fix-roapp-asset-endpoint.yml scripts/fix_roapp_asset_endpoint.py
          git commit -m "Fix VIN vehicle creation for RO App asset API versions"
          git push origin HEAD:main
