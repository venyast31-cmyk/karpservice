name: Find RO App webpack runtime function

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/find-roapp-runtime-function.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find runtime functions only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import html,re,urllib.parse,urllib.request
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript,*/*'}
          def fetch(url,cap=15_000_000):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.geturl(),r.read(cap).decode('utf-8','replace')
          root,page=fetch('https://web.roapp.io/login',5_000_000)
          scripts=[urllib.parse.urljoin(root,html.unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I)]
          out=[]
          for url in scripts:
              if urllib.parse.urlsplit(url).netloc!='web.roapp.io': continue
              try: final,body=fetch(url)
              except Exception: continue
              for pattern in [r'\.u\s*=\s*',r'\.p\s*=\s*',r'\.f\.j\s*=\s*',r'__webpack_require__\.u']:
                  matches=list(re.finditer(pattern,body))
                  for m in matches[:10]:
                      out.append(f'=== SOURCE {final} PATTERN {pattern} POS {m.start()} ===')
                      out.append(body[max(0,m.start()-1000):min(len(body),m.start()+30000)])
          if not out: out=['NO RUNTIME FUNCTION FOUND',*scripts]
          open('tmp/roapp-runtime-functions.txt','w',encoding='utf-8').write('\n'.join(out)[:250000])
          PY

      - name: Publish and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-runtime-functions.txt
          git rm -f .github/workflows/find-roapp-runtime-function.yml
          git commit -m "Record RO App runtime function context"
          git push origin HEAD:main
