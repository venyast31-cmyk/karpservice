name: Inspect Vinalfa response contract
on:
  push:
    branches: ['release/api']
    paths: ['worker/scripts/inspect-vinalfa.mjs']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect provider sample data only
        env:
          VINALFA_API_TOKEN: ${{ secrets.VINALFA_API_TOKEN }}
        run: node worker/scripts/inspect-vinalfa.mjs
