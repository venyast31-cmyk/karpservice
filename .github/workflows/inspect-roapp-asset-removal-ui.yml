name: Inspect RO App asset removal transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-roapp-asset-removal-ui.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Search public RO App source maps for asset deletion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import concurrent.futures
          import json
          import re
          import requests

          session = requests.Session()
          session.headers.update({"User-Agent":"KarpserviceSourceCheck/1.0"})
          page = session.get("https://web.roapp.io/login", timeout=30)
          page.raise_for_status()
          scripts = [urljoin(page.url, src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', page.text, re.I)]

          def inspect(script_url):
              result = []
              try:
                  script = session.get(script_url, timeout=45)
                  if not script.ok:
                      return result
                  match = re.search(r"sourceMappingURL=([^\s*]+)", script.text[-1500:])
                  if not match:
                      return result
                  map_url = urljoin(script_url, match.group(1).strip())
                  source_map = session.get(map_url, timeout=60)
                  if not source_map.ok or len(source_map.content) > 60_000_000:
                      return result
                  data = source_map.json()
                  for name, content in zip(data.get("sources", []), data.get("sourcesContent", [])):
                      if not content:
                          continue
                      lower = content.lower()
                      name_lower = name.lower()
                      asset_related = (
                          "warehouse/assets" in lower or
                          "asset" in name_lower or
                          "vehicle" in name_lower or
                          "транспорт" in lower
                      )
                      removal_related = any(token in lower for token in (
                          "delete", "remove", "archive", "unlink", "owner_id", "ownerid"
                      ))
                      if asset_related and removal_related:
                          result.append({
                              "script": script_url,
                              "map": map_url,
                              "source": name,
                              "content": content[:50000],
                          })
              except Exception:
                  pass
              return result

          matches = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              for group in executor.map(inspect, scripts):
                  matches.extend(group)

          output = {
              "script_count": len(scripts),
              "match_count": len(matches),
              "matches": matches[:80],
          }
          Path("tmp").mkdir(exist_ok=True)
          Path("tmp/roapp-asset-removal-ui.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Publish and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-asset-removal-ui.json
          git rm -f .github/workflows/inspect-roapp-asset-removal-ui.yml
          git commit -m "Record RO App asset removal transport"
          git pull --rebase origin main
          git push origin HEAD:main
