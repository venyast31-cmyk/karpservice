name: Add temporary VIN source diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-temporary-vin-source-diagnostic.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add fixed safe diagnostic route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("worker/src/index.js")
          text = path.read_text(encoding="utf-8")
          marker = '      if (url.pathname === "/health" && request.method === "GET") {'
          if text.count(marker) != 1:
              raise SystemExit(f"health marker count: {text.count(marker)}")

          route = r'''      if (url.pathname === "/health/vin-source" && request.method === "GET") {
        const vin = "TMBDX41U79B008586";
        const target = `https://autoua.com.ua/vin/${vin}?lang=en`;
        const startedAt = Date.now();
        try {
          const response = await fetch(target, {
            method: "GET",
            redirect: "follow",
            headers: {
              Accept: "text/html,application/xhtml+xml",
              "Accept-Language": "en,uk;q=0.9",
              "User-Agent": "Mozilla/5.0 (compatible; Karpservice/1.0; +https://karpservice-app.pages.dev)"
            }
          });
          const html = await response.text();
          const title = decodeVinHtmlText(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] || "");
          return json2({
            success: response.ok,
            status: response.status,
            redirected: response.redirected,
            final_url: response.url,
            content_type: response.headers.get("content-type") || "",
            server: response.headers.get("server") || "",
            cf_ray: response.headers.get("cf-ray") || "",
            length: html.length,
            contains_vin: html.toUpperCase().includes(vin),
            title,
            make: extractVinHtmlField(html, "Make"),
            model: extractVinHtmlField(html, "Model"),
            year: extractVinHtmlField(html, "Year"),
            preview: decodeVinHtmlText(html).slice(0, 350),
            elapsed_ms: Date.now() - startedAt
          }, 200, corsHeaders);
        } catch (error) {
          return json2({
            success: false,
            error_name: error?.name || "Error",
            error: error instanceof Error ? error.message : String(error),
            elapsed_ms: Date.now() - startedAt
          }, 200, corsHeaders);
        }
      }
'''
          path.write_text(text.replace(marker, route + marker, 1), encoding="utf-8")
          PY
          npm --prefix worker run check
          npm --prefix worker test

      - name: Publish and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git rm -f .github/workflows/add-temporary-vin-source-diagnostic.yml
          git commit -m "Add temporary VIN source diagnostic route"
          git push origin HEAD:main
