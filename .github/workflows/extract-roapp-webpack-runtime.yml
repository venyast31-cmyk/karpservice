name: Extract RO App webpack runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-roapp-webpack-runtime.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract chunk filename logic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import re, urllib.request
          urls=[
            'https://web.roapp.io/static/dist/js/91137.1b6c324af54ec91fcc2c.js',
            'https://web.roapp.io/static/dist/js/44985.984364f5665c79be25d3.js',
          ]
          out=[]
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/javascript'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(5_000_000).decode('utf-8','replace')
              out.append(f'\n=== {url} bytes={len(body)} ===')
              for pattern in [r'\.u\s*=\s*', r'\.miniCssF\s*=\s*', r'\.e\s*=\s*', r'chunk']:
                  for m in list(re.finditer(pattern,body,re.I))[:15]:
                      out.append(f'\n--- {pattern} at {m.start()} ---')
                      out.append(body[max(0,m.start()-3000):min(len(body),m.start()+12000)])
              for m in re.finditer(r'\{(?:\d+:"[a-f0-9]{6,}"[,]?){20,}\}',body):
                  out.append(f'\n--- LARGE MAP at {m.start()} len={len(m.group(0))} ---')
                  out.append(m.group(0)[:60000])
          open('tmp/roapp-webpack-runtime-context.txt','w',encoding='utf-8').write('\n'.join(out))
          PY

      - name: Publish and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-webpack-runtime-context.txt
          git rm -f .github/workflows/extract-roapp-webpack-runtime.yml
          git commit -m "Record RO App webpack runtime context"
          git push origin HEAD:main
