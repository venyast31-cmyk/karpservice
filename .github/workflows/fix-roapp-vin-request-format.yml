name: Fix RO App VIN request format

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-roapp-vin-request-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add compatible asset request encodings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          worker_path = Path("worker/src/index.js")
          worker = worker_path.read_text(encoding="utf-8")

          marker = 'async function createCustomerAsset(request, env, customerId, responseHeaders) {'
          if 'async function createRoappAssetCompatible(' not in worker:
              helpers = r'''
          function isRoappAssetValidationError(error) {
            return [400, 415, 422].includes(Number(error?.status));
          }
          __name(isRoappAssetValidationError, "isRoappAssetValidationError");
          function buildRoappAssetCreateOptions(payload, format) {
            if (format === "form") {
              const form = new URLSearchParams();
              for (const [key, value] of Object.entries(payload)) {
                if (value !== undefined && value !== null && value !== "") {
                  form.set(key, String(value));
                }
              }
              return {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                body: form.toString()
              };
            }
            if (format === "multipart") {
              const form = new FormData();
              for (const [key, value] of Object.entries(payload)) {
                if (value !== undefined && value !== null && value !== "") {
                  form.set(key, String(value));
                }
              }
              return { method: "POST", body: form };
            }
            return {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            };
          }
          __name(buildRoappAssetCreateOptions, "buildRoappAssetCreateOptions");
          async function findAssetAfterCreateAttempt(env, vin) {
            try {
              await delay(420);
              return await findAssetByVin(env, vin);
            } catch (error) {
              console.warn(JSON.stringify({
                event: "asset_create_verification_failed",
                message: error instanceof Error ? error.message : String(error)
              }));
              return null;
            }
          }
          __name(findAssetAfterCreateAttempt, "findAssetAfterCreateAttempt");
          async function createRoappAssetCompatible(env, payload) {
            let lastError = null;
            for (const format of ["json", "form", "multipart"]) {
              try {
                return await roappAssetRequest(
                  env,
                  (baseUrl) => baseUrl,
                  buildRoappAssetCreateOptions(payload, format)
                );
              } catch (error) {
                lastError = error;
                const existing = await findAssetAfterCreateAttempt(env, payload.uid);
                if (existing) {
                  return { status: 200, data: { data: existing } };
                }
                if (!isRoappAssetValidationError(error)) throw error;
                console.warn(JSON.stringify({
                  event: "asset_create_encoding_fallback",
                  format,
                  status: Number(error?.status) || 0,
                  message: error instanceof Error ? error.message : String(error)
                }));
                await delay(420);
              }
            }
            throw lastError || new Error("RO App не прийняв дані автомобіля");
          }
          __name(createRoappAssetCompatible, "createRoappAssetCompatible");
          '''.strip("\n")
              if marker not in worker:
                  raise SystemExit("createCustomerAsset marker not found")
              worker = worker.replace(marker, helpers + "\n" + marker, 1)

          start_marker = 'const createPayload = { uid: vin, owner_id: numericCustomerId };'
          end_marker = '  let asset = extractRecord(createResponse.data, ["asset"]);'
          start = worker.find(start_marker)
          end = worker.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("asset creation block markers not found")

          replacement = r'''  const createPayload = { uid: vin, owner_id: numericCustomerId };
            let createResponse;
            try {
              createResponse = await createRoappAssetCompatible(env, createPayload);
            } catch (error) {
              const errorText = String(error?.message || "");
              const needsGroup = isRoappAssetValidationError(error) && /group|груп/i.test(errorText);
              if (!needsGroup) throw error;
              const group = await inferCustomerVehicleGroup(env, numericCustomerId);
              createResponse = await createRoappAssetCompatible(env, { ...createPayload, group });
            }
          '''
          worker = worker[:start] + replacement + worker[end:]

          old_header = '      ...options.body ? { "Content-Type": "application/json" } : {},'
          new_header = '      ...roappDefaultContentType(options.body),'
          if old_header in worker:
              worker = worker.replace(old_header, new_header, 1)
          elif new_header not in worker:
              raise SystemExit("RO App content-type header marker not found")

          request_marker = 'async function roappRequest(env, url, options = {}) {'
          if 'function roappDefaultContentType(' not in worker:
              content_type_helper = r'''
          function roappDefaultContentType(body) {
            if (body === undefined || body === null) return {};
            if (typeof FormData !== "undefined" && body instanceof FormData) return {};
            if (typeof URLSearchParams !== "undefined" && body instanceof URLSearchParams) {
              return { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" };
            }
            return { "Content-Type": "application/json" };
          }
          __name(roappDefaultContentType, "roappDefaultContentType");
          '''.strip("\n")
              if request_marker not in worker:
                  raise SystemExit("roappRequest marker not found")
              worker = worker.replace(request_marker, content_type_helper + "\n" + request_marker, 1)

          worker_path.write_text(worker, encoding="utf-8")

          test_path = Path("worker/test/worker-security.test.mjs")
          test_text = test_path.read_text(encoding="utf-8")

          declaration = '  let createdAsset = null;'
          if 'let rejectJsonAssetCreate = true;' not in test_text:
              if declaration not in test_text:
                  raise SystemExit("test declaration marker not found")
              test_text = test_text.replace(
                  declaration,
                  declaration + '\n  let rejectJsonAssetCreate = true;',
                  1,
              )

          old_parse = '''    let requestBody = null;
              if (init.body) {
                const bodyText = typeof init.body === "string"
                  ? init.body
                  : new TextDecoder().decode(init.body);
                requestBody = JSON.parse(bodyText);
              }
              roappCalls.push({ url, method, body: requestBody });'''
          new_parse = '''    let requestBody = null;
              const requestHeaders = new Headers(init.headers || {});
              const requestContentType = requestHeaders.get("Content-Type") || "";
              if (init.body) {
                if (typeof FormData !== "undefined" && init.body instanceof FormData) {
                  requestBody = Object.fromEntries(init.body.entries());
                } else {
                  const bodyText = typeof init.body === "string"
                    ? init.body
                    : new TextDecoder().decode(init.body);
                  if (requestContentType.includes("application/x-www-form-urlencoded")) {
                    requestBody = Object.fromEntries(new URLSearchParams(bodyText));
                  } else {
                    requestBody = JSON.parse(bodyText);
                  }
                }
                if (requestBody?.owner_id !== undefined) {
                  requestBody.owner_id = Number(requestBody.owner_id);
                }
              }
              roappCalls.push({ url, method, body: requestBody, contentType: requestContentType });'''
          if old_parse in test_text:
              test_text = test_text.replace(old_parse, new_parse, 1)
          elif 'requestContentType' not in test_text:
              raise SystemExit("test request parser marker not found")

          old_post = '''      if (method === "POST") {
                  const payload = requestBody || {};
                  createdAsset = {
                    id: 501,
                    uid: payload.uid,
                    owner_id: payload.owner_id,
                    brand: "Mitsubishi",
                    model: "Outlander",
                    group: payload.group || "Автомобіль"
                  };
                  return Response.json({});
                }'''
          new_post = '''      if (method === "POST") {
                  const payload = requestBody || {};
                  if (rejectJsonAssetCreate && requestContentType.includes("application/json")) {
                    rejectJsonAssetCreate = false;
                    return Response.json({ uid: ["Invalid data type"] }, { status: 400 });
                  }
                  createdAsset = {
                    id: 501,
                    uid: payload.uid,
                    owner_id: payload.owner_id,
                    brand: "Mitsubishi",
                    model: "Outlander",
                    group: payload.group || "Автомобіль"
                  };
                  return Response.json({});
                }'''
          if old_post in test_text:
              test_text = test_text.replace(old_post, new_post, 1)
          elif 'rejectJsonAssetCreate &&' not in test_text:
              raise SystemExit("test POST marker not found")

          assertion_marker = '    assert.equal(createAssetCall.body.owner_id, 123);'
          if 'asset create must retry with a form-compatible encoding' not in test_text:
              extra_assertions = '''    assert.equal(createAssetCall.body.owner_id, 123);
              const assetCreateCalls = roappCalls.filter(({ url, method }) =>
                method === "POST" && url.pathname === "/v2/warehouse/assets"
              );
              assert.ok(assetCreateCalls.length >= 2, "asset create must retry with a form-compatible encoding");
              assert.ok(assetCreateCalls[0].contentType.includes("application/json"));
              assert.ok(
                assetCreateCalls.slice(1).some(({ contentType }) =>
                  contentType.includes("application/x-www-form-urlencoded") || !contentType
                ),
                "a non-JSON request format must be attempted after RO App rejects JSON"
              );'''
              if assertion_marker not in test_text:
                  raise SystemExit("test assertion marker not found")
              test_text = test_text.replace(assertion_marker, extra_assertions, 1)

          test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Verify Worker and tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix worker run check
          npm --prefix worker test
          grep -q 'createRoappAssetCompatible' worker/src/index.js
          grep -q 'application/x-www-form-urlencoded' worker/src/index.js
          grep -q 'multipart' worker/src/index.js

      - name: Publish fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/test/worker-security.test.mjs
          git rm -f .github/workflows/fix-roapp-vin-request-format.yml
          git commit -m "Support RO App VIN creation request formats"
          git push origin HEAD:main
