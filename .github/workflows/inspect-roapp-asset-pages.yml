name: Inspect RO App asset API pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-roapp-asset-pages.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract official asset-related documentation pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import requests

          session = requests.Session()
          session.headers.update({"User-Agent":"KarpserviceDocsCheck/1.0"})
          sitemap = session.get("https://roappua.readme.io/sitemap.xml", timeout=30)
          sitemap.raise_for_status()
          urls = re.findall(r"<loc>([^<]+)</loc>", sitemap.text)
          selected = [url for url in urls if re.search(r"asset|warehouse|вироб|транспорт|vehicle", url, re.I)]
          candidates = selected + [
              "https://roappua.readme.io/reference/create-asset",
              "https://roappua.readme.io/reference/get-assets",
              "https://roappua.readme.io/reference/update-asset",
              "https://roappua.readme.io/reference/delete-asset",
              "https://roappua.readme.io/reference/remove-asset",
          ]
          seen = set()
          out = [f"SITEMAP_URLS={len(urls)}", f"ASSET_URLS={len(selected)}"]
          for base in candidates:
              if base in seen:
                  continue
              seen.add(base)
              for url in (base + ".md", base):
                  try:
                      response = session.get(url, timeout=30)
                      if response.status_code == 404:
                          continue
                      out.append(f"\n===== {url} HTTP {response.status_code} {response.headers.get('content-type','')} =====\n{response.text[:30000]}")
                      break
                  except Exception as error:
                      out.append(f"\n===== {url} ERROR {type(error).__name__}: {error} =====")
                      break
          Path("tmp/roapp-asset-pages.txt").write_text("\n".join(out), encoding="utf-8")
          PY

      - name: Publish and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-asset-pages.txt
          git rm -f .github/workflows/inspect-roapp-asset-pages.yml
          git commit -m "Record RO App asset API pages"
          git pull --rebase origin main
          git push origin HEAD:main
