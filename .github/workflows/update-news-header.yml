name: Apply clean news header

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news-header.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove subtitle and preserve clean spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          subtitle = '    <p class="news-feed-subtitle">Новини Karpservice</p>\n'
          if subtitle not in text:
              raise SystemExit("News subtitle was not found")
          text = text.replace(subtitle, "", 1)

          old_title_css = "  .news-feed-title{margin-bottom:4px}"
          new_title_css = "  .news-feed-title{margin-bottom:42px}"
          if old_title_css not in text:
              raise SystemExit("News title spacing rule was not found")
          text = text.replace(old_title_css, new_title_css, 1)

          text = text.replace("  .news-feed-subtitle{margin:0 0 18px}\n", "", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Publish update and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-news-header.yml
          git commit -m "Remove news subtitle and keep clean header spacing"
          git push origin HEAD:main
