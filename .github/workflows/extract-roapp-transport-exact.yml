name: Extract exact RO App transport implementation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-roapp-transport-exact.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find exact transport sources in public source maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          python - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import urllib.parse
          import urllib.request

          H={"User-Agent":"Mozilla/5.0 Chrome/126 Safari/537.36","Accept":"text/html,application/javascript,application/json,*/*"}
          def get(url,cap=100_000_000):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=40) as r:
                  return r.geturl(),r.read(cap)

          root,pageb=get("https://web.roapp.io/login",5_000_000)
          page=pageb.decode("utf-8","replace")
          scripts=[urllib.parse.urljoin(root,html.unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I)]
          scripts=list(dict.fromkeys(scripts))

          exact_name_tokens=(
              "services/transport/fetch",
              "service/transport/fetch",
              "transport/fetch",
          )
          definition_tokens=(
              "export const fetchRequest",
              "export function fetchRequest",
              "fetchRequest =",
              "function fetchRequest",
          )

          def inspect(script):
              try:
                  _,jsb=get(script,25_000_000)
                  js=jsb.decode("utf-8","replace")
              except Exception:
                  return []
              map_urls=[script+".map"]
              m=re.search(r"sourceMappingURL=([^\s*]+)",js[-2000:])
              if m: map_urls.insert(0,urllib.parse.urljoin(script,m.group(1).strip()))
              rows=[]
              for map_url in dict.fromkeys(map_urls):
                  try:
                      _,mb=get(map_url)
                      sm=json.loads(mb.decode("utf-8","replace"))
                  except Exception:
                      continue
                  sources=sm.get("sources") or []
                  contents=sm.get("sourcesContent") or []
                  for i,content in enumerate(contents):
                      if not isinstance(content,str): continue
                      name=sources[i] if i<len(sources) else f"source-{i}"
                      lname=name.lower(); lcontent=content.lower()
                      by_name=any(token in lname for token in exact_name_tokens)
                      by_definition=any(token.lower() in lcontent for token in definition_tokens)
                      if by_name or by_definition:
                          rows.append({"script":script,"map":map_url,"source":name,"by_name":by_name,"by_definition":by_definition,"content":content})
              return rows

          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for group in ex.map(inspect,scripts): rows.extend(group)
          unique=[]; seen=set()
          for row in rows:
              key=(row["source"],row["content"][:1000])
              if key in seen: continue
              seen.add(key); unique.append(row)
          out={"page":root,"scripts":len(scripts),"matches":len(unique),"sources":unique}
          open("tmp/roapp-transport-exact.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2)[:2_000_000])
          if not unique: raise SystemExit("Exact transport source not found")
          PY

      - name: Publish and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-transport-exact.json
          git rm -f .github/workflows/extract-roapp-transport-exact.yml
          git commit -m "Record exact RO App transport implementation"
          git pull --rebase origin main
          git push origin HEAD:main
