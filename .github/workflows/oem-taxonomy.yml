name: Inspect OEM quick groups
on:
  push:
    branches: [release/api]
    paths: [.github/workflows/oem-taxonomy.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://api.vinalfa.com/oem/v2/vehicles/e60205b2fdcc2c4487a18a19727808b2/quick-selection',{headers:{Authorization:'Bearer '+process.env.VINALFA_API_TOKEN}});
          const d=await r.json();console.log(JSON.stringify({status:r.status,taxonomy:d.data?.quick_taxonomy}));
          JS
        env:
          VINALFA_API_TOKEN: ${{ secrets.VINALFA_API_TOKEN }}
