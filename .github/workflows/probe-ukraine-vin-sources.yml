name: Probe Ukrainian VIN sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ukraine-vin-sources.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Probe sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          vins = ["TMBDX41U79B008586", "JMBSRCS3A6U011108"]
          result = {}

          def fetch_text(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "text/html,application/json;q=0.9,*/*;q=0.8",
                      "Accept-Language": "uk-UA,uk;q=0.9,en;q=0.7",
                      "User-Agent": "Mozilla/5.0 (compatible; KarpserviceVIN/1.0; +https://venyast31-cmyk.github.io/karpservice/)",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      body = response.read().decode("utf-8", "replace")
                      return {
                          "status": response.status,
                          "url": response.geturl(),
                          "content_type": response.headers.get("content-type"),
                          "length": len(body),
                          "sample": body[:30000],
                      }
              except Exception as exc:
                  return {"error": f"{type(exc).__name__}: {exc}"}

          for vin in vins:
              result[vin] = {
                  "autoua": fetch_text(f"https://autoua.com.ua/vin/{vin}?lang=en"),
                  "opencars_decoder": fetch_text(f"https://api.opencars.app/vin-decoder/{vin}"),
                  "opencars_vehicle": fetch_text(f"https://api.opencars.app/customer/vehicles/{vin}"),
              }

          Path("tmp").mkdir(exist_ok=True)
          Path("tmp/ukraine-vin-source-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Publish probe and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/ukraine-vin-source-probe.json
          git rm -f .github/workflows/probe-ukraine-vin-sources.yml
          git commit -m "Record Ukrainian VIN source probe"
          git push origin HEAD:main
