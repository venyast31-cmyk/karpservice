name: Deploy and verify VIN decoder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-vin-decoder.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Switch VIN decoder to DB.VIN and add temporary check route
        env:
          PATCH_B64: "" }
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]))'
          npm --prefix worker run check
          npm --prefix worker test

      - name: Publish test version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git commit -m "Use DB.VIN for vehicle identity lookup"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify decoder from Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          endpoint="https://karpservice-api.venyast31.workers.dev/health/vin-decoder-check"
          success=0
          for attempt in $(seq 1 45); do
            code=$(curl -sS --max-time 15 -o tmp/vin-decoder-worker-check.json -w "%{http_code}" "$endpoint" || true)
            if [ "$code" = "200" ] && grep -q '"marker": "vin_decoder_dbvin_v1"' tmp/vin-decoder-worker-check.json && grep -q '"success": true' tmp/vin-decoder-worker-check.json; then
              success=1
              break
            fi
            sleep 4
          done
          cat tmp/vin-decoder-worker-check.json 2>/dev/null || true
          if [ "$success" != "1" ]; then
            echo "VIN decoder did not pass the Cloudflare Worker check" >&2
            exit 1
          fi

      - name: Remove temporary diagnostics and publish production version
        env:
          CLEANUP_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["CLEANUP_B64"]))'
          rm -rf tmp
          git rm -f .github/workflows/deploy-vin-decoder.yml
          npm --prefix worker run check
          npm --prefix worker test
          git add -A
          git commit -m "Finalize VIN decoder and remove diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
