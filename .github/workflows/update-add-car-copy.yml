name: Update add-car automatic copy
on:
  push:
    branches: [main]
    paths: [".github/workflows/update-add-car-copy.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace CRM/integration wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Введіть VIN-код. Марку, модель та інші дані підтягне інтеграція CRM.'
          new='Введіть VIN-код. Марка, модель та інші дані підтягнуться автоматично.'
          if old not in s:
              old='Введіть VIN-код. Марку, модель та інші дані підтягне інтеграція.'
          if old not in s:
              raise SystemExit('Target add-car copy not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify and publish
        shell: bash
        run: |
          set -e
          grep -Fq 'Марка, модель та інші дані підтягнуться автоматично.' index.html
          ! grep -Fq 'підтягне інтеграція CRM' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/update-add-car-copy.yml
          git commit -m 'Use automatic wording on VIN form'
          git push origin HEAD:main
