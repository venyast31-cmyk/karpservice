name: Verify OEM non-filter searches
on:
  push:
    branches: [release/api]
    paths: [.github/workflows/oem-search-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node --input-type=module <<'JS'
          for(const q of ['radiator','pump','brake disc','engine mount']){
            const r=await fetch('https://api.vinalfa.com/oem/v2/vehicles/e60205b2fdcc2c4487a18a19727808b2/search?'+new URLSearchParams({q}),{headers:{Authorization:'Bearer '+process.env.VINALFA_API_TOKEN}});
            const d=await r.json();console.log(JSON.stringify({query:q,status:r.status,items:d.data?.items?.map(n=>({hash:n.hash,name:n.name,image:n.image,foundParts:n.foundParts}))}));
          }
          JS
        env:
          VINALFA_API_TOKEN: ${{ secrets.VINALFA_API_TOKEN }}
