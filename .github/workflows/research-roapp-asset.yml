name: Research RO App asset API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-roapp-asset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch authoritative and indexed API material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          : > tmp/roapp-asset-research.txt

          echo '=== Context7 targeted API query ===' >> tmp/roapp-asset-research.txt
          curl -fsSL --retry 2 --max-time 40 \
            'https://context7.com/api/v2/context?libraryId=%2Fwebsites%2Froapp_readme_io&query=Create%20Asset%20POST%20warehouse%20assets%20uid%20owner_id%20request%20body%20example&type=txt' \
            >> tmp/roapp-asset-research.txt || true

          printf '\n\n=== RO App llms.txt matching sections ===\n' >> tmp/roapp-asset-research.txt
          curl -fsSL --retry 2 --max-time 60 \
            'https://context7.com/websites/roapp_readme_io/llms.txt?tokens=140000' \
            -o /tmp/roapp-llms.txt || true
          if [ -s /tmp/roapp-llms.txt ]; then
            python - <<'PY' >> tmp/roapp-asset-research.txt
          from pathlib import Path
          text = Path('/tmp/roapp-llms.txt').read_text(encoding='utf-8', errors='replace')
          needles = ['Create Asset', 'Створити виріб', '/warehouse/assets', 'create-asset']
          spans = []
          lower = text.lower()
          for needle in needles:
              start = 0
              while True:
                  i = lower.find(needle.lower(), start)
                  if i < 0:
                      break
                  spans.append((max(0, i - 2500), min(len(text), i + 7000)))
                  start = i + len(needle)
          merged = []
          for a, b in sorted(spans):
              if merged and a <= merged[-1][1] + 500:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], b))
              else:
                  merged.append((a, b))
          if not merged:
              print('No matching sections found. Full length:', len(text))
          else:
              for n, (a, b) in enumerate(merged[:12], 1):
                  print(f'\n--- MATCH {n} [{a}:{b}] ---\n')
                  print(text[a:b])
          PY
          fi

          printf '\n\n=== Raw ReadMe page signals ===\n' >> tmp/roapp-asset-research.txt
          curl -fsSL --retry 2 --max-time 40 \
            'https://roappua.readme.io/reference/create-asset' \
            -o /tmp/create-asset.html || true
          if [ -s /tmp/create-asset.html ]; then
            python - <<'PY' >> tmp/roapp-asset-research.txt
          from pathlib import Path
          import re, html
          text = Path('/tmp/create-asset.html').read_text(encoding='utf-8', errors='replace')
          print('HTML length:', len(text))
          for needle in ['warehouse/assets', 'operationId', 'requestBody', 'uid', 'application/json', 'application/x-www-form-urlencoded']:
              print(f'\n### {needle}')
              positions = [m.start() for m in re.finditer(re.escape(needle), text, flags=re.I)]
              print('occurrences:', len(positions))
              for i in positions[:8]:
                  chunk = html.unescape(text[max(0, i-1200):min(len(text), i+3000)])
                  print(chunk.replace('><', '>\n<'))
                  print('\n---')
          PY
          fi

      - name: Publish research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-asset-research.txt
          git rm -f .github/workflows/research-roapp-asset.yml
          git commit -m "Capture RO App asset API schema research"
          git push origin HEAD:main
