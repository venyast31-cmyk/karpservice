name: Probe VIN lookup proxy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vin-jina.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Probe Jina Reader for VIN source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          : > tmp/jina-vin-probe.txt
          for url in \
            'https://r.jina.ai/http://autoua.com.ua/vin/TMBDX41U79B008586?lang=en' \
            'https://r.jina.ai/https://autoua.com.ua/vin/TMBDX41U79B008586?lang=en'
          do
            echo "URL=$url" >> tmp/jina-vin-probe.txt
            status=$(curl -L --max-time 25 -sS -o /tmp/body.txt -w '%{http_code}' "$url" || true)
            echo "STATUS=$status" >> tmp/jina-vin-probe.txt
            grep -E -i -m 8 'Skoda|Octavia|2008|Make|Model|Year|Title:' /tmp/body.txt >> tmp/jina-vin-probe.txt || true
            echo '---' >> tmp/jina-vin-probe.txt
          done
      - name: Publish probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/jina-vin-probe.txt
          git rm -f .github/workflows/probe-vin-jina.yml
          git commit -m "Record VIN proxy probe"
          git push origin HEAD:main
