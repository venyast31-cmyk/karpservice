name: Inspect current Karpservice API bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-current-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect health and CORS responses
        env:
          BRIDGE_URL: "https://karpservice-api-bridge.scratched-wind.workers.dev"
          APP_ORIGIN: "https://venyast31-cmyk.github.io"
        run: |
          set -u
          echo "=== HEALTH WITHOUT ORIGIN ==="
          curl --silent --show-error --include "$BRIDGE_URL/healthz" || true
          echo
          echo "=== HEALTH WITH APP ORIGIN ==="
          curl --silent --show-error --include --header "Origin: $APP_ORIGIN" "$BRIDGE_URL/healthz" || true
          echo
          echo "=== PREFLIGHT ==="
          curl --silent --show-error --include \
            --request OPTIONS \
            --header "Origin: $APP_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            "$BRIDGE_URL/auth/request" || true
