name: Test current Karpservice API bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-current-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify health and CORS
        env:
          BRIDGE_URL: "https://karpservice-api-bridge.scratched-wind.workers.dev"
          APP_ORIGIN: "https://venyast31-cmyk.github.io"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BRIDGE_URL/healthz" | grep '"success":true'
          curl --silent --show-error --dump-header /tmp/preflight-headers --output /dev/null \
            --request OPTIONS \
            --header "Origin: $APP_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: content-type" \
            "$BRIDGE_URL/auth/request"
          grep -i "^access-control-allow-origin: $APP_ORIGIN" /tmp/preflight-headers
          status="$(curl --silent --show-error --write-out '%{http_code}' --output /tmp/body.json \
            --request POST \
            --header "Origin: $APP_ORIGIN" \
            --header "Content-Type: application/json" \
            --data '{"phone":"123"}' \
            "$BRIDGE_URL/auth/request")"
          test "$status" = "400"
          grep '"success":false' /tmp/body.json
