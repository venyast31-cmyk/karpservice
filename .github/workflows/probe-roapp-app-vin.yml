name: Probe RO App VIN lookup app route

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-roapp-app-vin.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add temporary Worker probe
        env:
          PATCH_B64: ""
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]))'
          npm --prefix worker run check
          npm --prefix worker test

      - name: Publish probe source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git rm -f .github/workflows/probe-roapp-app-vin.yml
          git commit -m "Add temporary RO App app-route VIN probe"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Wait for Worker and record result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          endpoint="https://karpservice-api.venyast31.workers.dev/health/roapp-app-vin"
          success=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 15 -o tmp/roapp-app-vin-probe.json -w "%{http_code}" "$endpoint" || true)
            if [ "$code" = "200" ] && grep -q 'roapp_app_vin_probe_v1' tmp/roapp-app-vin-probe.json; then
              success=1
              break
            fi
            sleep 4
          done
          if [ "$success" != "1" ]; then
            echo "Worker probe did not become available" >&2
            cat tmp/roapp-app-vin-probe.json 2>/dev/null || true
            exit 1
          fi
          python -m json.tool tmp/roapp-app-vin-probe.json > tmp/roapp-app-vin-probe.pretty.json
          mv tmp/roapp-app-vin-probe.pretty.json tmp/roapp-app-vin-probe.json
          git add tmp/roapp-app-vin-probe.json
          git commit -m "Record RO App app-route VIN probe"
          git pull --rebase origin main
          git push origin HEAD:main
