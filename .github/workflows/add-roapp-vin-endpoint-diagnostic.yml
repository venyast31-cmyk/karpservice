name: Add RO App VIN endpoint diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-roapp-vin-endpoint-diagnostic.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add safe diagnostic route
        env:
          PATCH_B64: ""
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]))'
          npm --prefix worker run check
          npm --prefix worker test

      - name: Publish and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js
          git rm -f .github/workflows/add-roapp-vin-endpoint-diagnostic.yml
          git commit -m "Add RO App VIN endpoint diagnostic route"
          git push origin HEAD:main
