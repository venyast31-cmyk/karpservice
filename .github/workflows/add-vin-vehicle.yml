name: Add VIN-only vehicle creation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-vin-vehicle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare resilient customer assets loading
        run: python scripts/fix_vin_patch.py

      - name: Patch frontend and API
        run: python scripts/add_vin_vehicle.py

      - name: Verify changes
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix worker run check
          npm --prefix worker test
          grep -q 'id="addCar"' index.html
          grep -q "apiFetch('cars'" index.html
          grep -q 'url.pathname === "/cars"' worker/src/index.js
          grep -q 'warehouse/assets' worker/src/index.js

      - name: Publish feature and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html worker/src/index.js
          git rm .github/workflows/add-vin-vehicle.yml scripts/add_vin_vehicle.py scripts/fix_vin_patch.py
          git commit -m "Add VIN-only vehicle creation linked to CRM"
          git push origin HEAD:main
