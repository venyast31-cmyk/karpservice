name: Add VIN-only vehicle creation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-vin-vehicle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add VIN vehicle flow to frontend and API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # -------------------------
          # Backend Worker
          # -------------------------
          worker_path = Path("worker/src/index.js")
          worker = worker_path.read_text(encoding="utf-8")

          worker = replace_once(
              worker,
              '  const orderResult = await getAllCustomerOrders(env, customer.id);\n  const cars = buildCarsFromOrders(orderResult.orders);',
              '  const orderResult = await getAllCustomerOrders(env, customer.id);\n  const assets = await getCustomerAssets(env, customer.id);\n  const cars = mergeCustomerAssets(assets, orderResult.orders);',
              "customer assets loading",
          )

          asset_helpers = r'''
async function getCustomerAssets(env, customerId) {
  const assetsUrl = new URL(`${ROAPP_BASE}/warehouse/assets`);
  assetsUrl.searchParams.append("owner_id", String(customerId));
  const response = await roappRequest(env, assetsUrl.toString());
  const assets = extractList(response.data, ["assets"]);
  return assets.filter((asset) => {
    const ownerId = assetOwnerId(asset);
    return ownerId === 0 || ownerId === Number(customerId);
  });
}
