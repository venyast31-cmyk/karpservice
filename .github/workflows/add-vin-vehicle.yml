          worker_path.write_text(worker, encoding="utf-8")

          # -------------------------
          # Frontend
          # -------------------------
          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")

          html = replace_once(
              html,
              '  .vin{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:#aeb7c3}\n  .empty{text-align:center;padding:24px 12px;color:var(--muted)}',
              '  .vin{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:#aeb7c3}\n  .add-car-button{margin:0 0 18px;border-style:dashed;border-color:rgba(114,230,170,.34)}\n  .vin-input{text-transform:uppercase;letter-spacing:1.6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:750}\n  .vin-help{margin:9px 1px 0;line-height:1.45}\n  .empty{text-align:center;padding:24px 12px;color:var(--muted)}',
              "VIN frontend styles",
          )

          old_cars_section = '''  <section id="cars" class="screen">
    <div id="carsLoader" class="loader">Завантаження…</div>
    <h2 id="carsHeading" class="section-title">Ваш автомобіль</h2>
    <div id="carsList"></div>
  </section>'''
          new_cars_section = '''  <section id="cars" class="screen">
    <div id="carsLoader" class="loader">Завантаження…</div>
    <h2 id="carsHeading" class="section-title">Ваш автомобіль</h2>
