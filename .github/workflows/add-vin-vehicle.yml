async function addCarByVin(){
  const input = document.getElementById('carVin');
  const btn = document.getElementById('addCarBtn');
  const vin = normalizeVin(input?.value);
  if (input) input.value = vin;

  if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){
    showStatus('VIN має містити рівно 17 символів без літер I, O та Q.', 'error', 'addCarStatus');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Додаємо…';
  showStatus('Перевіряємо VIN у CRM…', 'ok', 'addCarStatus');

  try{
    const res = await apiFetch('cars', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({vin})
    });
    const data = await responseJson(res);

    if (res.status === 401){
      setAuthSession(false);
      clearLegacyAuthToken();
      resetAuthFlow({message:'Сесія завершилася. Підтвердьте вхід через Telegram ще раз.'});
      show('login');
      return;
    }
    if (!res.ok || !data.success){
      throw new Error(data.error || 'Не вдалося додати автомобіль.');
    }

    const notice = data.already_exists
      ? 'Цей автомобіль уже є у вашому профілі.'
      : 'Автомобіль додано. Марка й модель підтягнуться з CRM автоматично.';
    const refreshed = await loadCustomer({targetScreen:'cars'});
    if (refreshed) showStatus(notice, 'ok', 'carsStatus');
  }catch(err){
    showStatus(err.message || 'Не вдалося додати автомобіль.', 'error', 'addCarStatus');
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Додати автомобіль';
  }
}'''
