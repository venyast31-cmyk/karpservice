    position:relative;width:min(390px,100%);padding:25px 20px 20px;text-align:center;
    border-radius:25px;border:1px solid rgba(114,230,170,.62);
    background:
      radial-gradient(circle at 50% 0,rgba(8,116,81,.18),transparent 44%),
