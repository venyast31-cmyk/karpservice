    border:1px solid rgba(194,97,116,.58);border-radius:14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 22px rgba(58,20,29,.22)
  }
  .delete-car-button:not(:disabled):hover{filter:brightness(1.06)}
  .delete-car-button .action-icon{width:22px;height:22px;display:grid;place-items:center}
  .delete-car-button .action-icon svg{width:22px;height:22px;display:block}
  body.modal-open{overflow:hidden}
  .confirm-modal[hidden]{display:none}
  .confirm-modal{
