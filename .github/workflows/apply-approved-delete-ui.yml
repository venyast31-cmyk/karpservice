  .delete-car-button .action-icon{width:20px;height:20px;display:grid;place-items:center;flex:0 0 20px}
  .delete-car-button .action-icon svg{width:20px;height:20px;display:block}
'''
          new_delete_css = '''  .car-side{display:flex;flex:0 0 auto;flex-direction:column;align-items:flex-end;gap:12px}
  .delete-car-button{
    width:48px;height:48px;min-width:48px;min-height:48px;margin:0;padding:0;
