  .confirm-modal-note{margin-top:12px!important;color:var(--muted)!important}
  .confirm-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:21px}
  .confirm-modal-actions button{min-height:52px;margin:0;border-radius:16px}
  .confirm-modal-cancel{
    color:#f3f6f8;background:#151b20;border:1px solid rgba(114,230,170,.54);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04)
  }
  .confirm-modal-delete{
    color:#fff;background:linear-gradient(145deg,#743745,#522730);
    border:1px solid rgba(207,105,125,.62);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 11px 24px rgba(67,23,32,.23)
  }
  .confirm-modal .status{margin-top:14px;text-align:left}
'''
          replace_once(old_delete_css, new_delete_css, "delete and modal CSS")

          replace_once(
              '''    .vehicle-actions{grid-template-columns:1fr}
    .delete-car-button{width:100%;min-height:52px}
''',
              '''    .car-side{gap:10px}
    .delete-car-button{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:13px}
    .confirm-modal-panel{padding:22px 16px 17px}
    .confirm-modal-panel h2{font-size:23px}
''',
              "mobile delete CSS",
          )

          # Replace the home icon with a compact newspaper/feed icon for News.
          replace_once(
              '''    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg>
    <span class="bottom-nav-label">Новини</span>''',
              '''    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h12v13H6a2 2 0 0 1-2-2v-11Z"/><path d="M16 8h4v8.5a2 2 0 0 1-2 2h-2V8Z"/><path d="M7.5 9h5M7.5 12h5M7.5 15h3.5"/></svg>
    <span class="bottom-nav-label">Новини</span>''',
              "news navigation icon",
          )

          # Add the custom in-app confirmation dialog before bottom navigation.
          modal_markup = '''
<div id="deleteCarModal" class="confirm-modal" hidden aria-hidden="true">
  <div class="confirm-modal-backdrop" onclick="closeDeleteCarModal()" aria-hidden="true"></div>
  <section class="confirm-modal-panel" role="dialog" aria-modal="true"
    aria-labelledby="deleteCarModalTitle" aria-describedby="deleteCarModalDescription deleteCarModalNote">
    <div class="confirm-modal-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
    </div>
    <h2 id="deleteCarModalTitle">Видалити автомобіль?</h2>
    <p id="deleteCarModalDescription">Ви впевнені, що хочете прибрати цей автомобіль зі вкладки «Авто»?</p>
    <p id="deleteCarModalNote" class="confirm-modal-note">Історія обслуговування в CRM збережеться. Автомобіль можна буде додати знову за VIN.</p>
    <div id="deleteCarModalStatus" class="status"></div>
    <div class="confirm-modal-actions">
      <button id="deleteCarCancelBtn" class="confirm-modal-cancel" type="button" onclick="closeDeleteCarModal()">Скасувати</button>
      <button id="deleteCarConfirmBtn" class="confirm-modal-delete" type="button" onclick="confirmDeleteCarFromProfile()">Видалити</button>
    </div>
  </section>
</div>
'''
          replace_once(
              '''</div>

<nav id="bottomNav" class="bottom-nav" aria-label="Головна навігація">''',
              '''</div>
''' + modal_markup + '''
<nav id="bottomNav" class="bottom-nav" aria-label="Головна навігація">''',
              "modal markup",
          )

          # Modal state.
          replace_once(
              '''let selectedTime = "";
const MIN_BOOKING_LEAD_MS''',
              '''let selectedTime = "";
let pendingDeleteCar = null;
let deleteCarModalBusy = false;
const MIN_BOOKING_LEAD_MS''',
              "modal state",
          )

          # Move the square delete control onto the vehicle card.
          replace_once(
              '''            <span class="pill ${active ? 'blue' : ''}">${visits} ${visitWord(visits)}</span>
          </div>''',
              '''            <div class="car-side">
              <span class="pill ${active ? 'blue' : ''}">${visits} ${visitWord(visits)}</span>
              <button class="delete-car-button" type="button" data-car-id="${Number(car.id)}"
                aria-label="Видалити ${escapeHtml(title)}" title="Видалити автомобіль"
                onclick="deleteCarFromProfile(this)">
                <span class="action-icon">${UI_ICONS.trash}</span>
              </button>
            </div>
          </div>''',
              "delete button on car card",
          )
          replace_once(
              '''        <div class="vehicle-actions">
          <button class="primary action-primary" type="button" onclick="startBooking(${Number(car.id)})">
            <span class="action-icon">${UI_ICONS.calendar}</span>
            <span>Записати на сервіс</span>
          </button>
          <button class="delete-car-button" type="button" data-car-id="${Number(car.id)}"
            aria-label="Видалити ${escapeHtml(title)}" onclick="deleteCarFromProfile(this)">
            <span class="action-icon">${UI_ICONS.trash}</span>
            <span>Видалити</span>
          </button>
        </div>''',
              '''        <button class="primary action-primary" type="button" onclick="startBooking(${Number(car.id)})">
          <span class="action-icon">${UI_ICONS.calendar}</span>
          <span>Записати на сервіс</span>
        </button>''',
              "remove full-width delete action",
          )

          # Replace the native browser confirm with the branded modal flow.
          modal_functions = r'''function deleteCarFromProfile(button){
  const carId = Number(button?.dataset?.carId);
  const car = getCar(carId);
  if (!car){
    showStatus('Автомобіль не знайдено. Оновіть список.', 'error', 'carsStatus');
    return;
  }

  const modal = document.getElementById('deleteCarModal');
  const description = document.getElementById('deleteCarModalDescription');
  const title = carName(car);
  const vin = normalizeVin(car.vin);

  pendingDeleteCar = {car, trigger:button};
  deleteCarModalBusy = false;
  description.textContent = vin
    ? `Ви впевнені, що хочете прибрати ${title} (${vin}) зі вкладки «Авто»?`
    : `Ви впевнені, що хочете прибрати ${title} зі вкладки «Авто»?`;
  showStatus('', 'error', 'deleteCarModalStatus');
  modal.hidden = false;
  modal.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open');
  window.requestAnimationFrame(() => document.getElementById('deleteCarCancelBtn')?.focus());
}

function closeDeleteCarModal(force=false){
  if (deleteCarModalBusy && !force) return;
  const modal = document.getElementById('deleteCarModal');
  const trigger = pendingDeleteCar?.trigger;
  modal.hidden = true;
  modal.setAttribute('aria-hidden','true');
  document.body.classList.remove('modal-open');
  showStatus('', 'error', 'deleteCarModalStatus');
  pendingDeleteCar = null;
  if (trigger?.isConnected) window.requestAnimationFrame(() => trigger.focus());
}

async function confirmDeleteCarFromProfile(){
  const pending = pendingDeleteCar;
  const car = pending?.car;
  const confirmBtn = document.getElementById('deleteCarConfirmBtn');
  const cancelBtn = document.getElementById('deleteCarCancelBtn');
  if (!car || deleteCarModalBusy) return;

  deleteCarModalBusy = true;
  confirmBtn.disabled = true;
  cancelBtn.disabled = true;
  confirmBtn.textContent = 'Видаляємо…';
  showStatus('Видаляємо автомобіль із профілю…', 'ok', 'deleteCarModalStatus');

  try{
    const res = await apiFetch('cars/remove', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({car_id:car.id, vin:car.vin || ''})
    });
    const data = await responseJson(res);

    if (res.status === 401){
      closeDeleteCarModal(true);
      setAuthSession(false);
      clearLegacyAuthToken();
      resetAuthFlow({message:'Сесія завершилася. Підтвердьте вхід через Telegram ще раз.'});
      show('login');
      return;
    }
    if (!res.ok || !data.success){
      throw new Error(readableUiError(data.error || data, 'Не вдалося видалити автомобіль.'));
    }

    const notice = data.message || 'Автомобіль видалено з профілю.';
    closeDeleteCarModal(true);
    const refreshed = await loadCustomer({targetScreen:'cars'});
    if (refreshed) showStatus(notice, 'ok', 'carsStatus');
  }catch(err){
    showStatus(err.message || 'Не вдалося видалити автомобіль.', 'error', 'deleteCarModalStatus');
    console.error(err);
  }finally{
    deleteCarModalBusy = false;
    confirmBtn.disabled = false;
    cancelBtn.disabled = false;
    confirmBtn.textContent = 'Видалити';
  }
}

function handleDeleteCarModalKeydown(event){
  const modal = document.getElementById('deleteCarModal');
  if (!modal || modal.hidden) return;
  if (event.key === 'Escape'){
    event.preventDefault();
    closeDeleteCarModal();
    return;
  }
  if (event.key !== 'Tab') return;
  const focusable = [...modal.querySelectorAll('button:not(:disabled)')];
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first){
    event.preventDefault();
    last.focus();
  }else if (!event.shiftKey && document.activeElement === last){
    event.preventDefault();
    first.focus();
  }
}

document.addEventListener('keydown', handleDeleteCarModalKeydown);
'''
          pattern = re.compile(
              r"async function deleteCarFromProfile\(button\)\{.*?\n\}\n\nfunction toggleNewsDetails",
              re.S,
          )
          text, count = pattern.subn(modal_functions + "\nfunction toggleNewsDetails", text, count=1)
          if count != 1:
              raise RuntimeError(f"delete flow: expected 1 match, found {count}")

          # Safety and completion assertions.
          required = [
              'id="deleteCarModal"',
              'class="car-side"',
              'confirmDeleteCarFromProfile()',
              'M4 5.5h12v13H6',
          ]
          for marker in required:
              if marker not in text:
                  raise RuntimeError(f"missing final marker: {marker}")
          if 'window.confirm(' in text:
              raise RuntimeError('native confirmation dialog is still present')
          if 'class="vehicle-actions"' in text:
              raise RuntimeError('old full-width delete action is still present')

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate inline JavaScript and UI markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/karpservice-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert text.count('id="deleteCarModal"') == 1
          assert text.count('class="delete-car-button"') == 1
          assert 'window.confirm(' not in text
          PY
          node --check /tmp/karpservice-inline.js

      - name: Publish approved design and clean temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp/roapp-asset-pages.txt tmp/roapp-delete-asset-docs.txt tmp/roapp-asset-removal-ui.json
          git rm -f .github/workflows/apply-approved-delete-ui.yml
          git add index.html tmp
          git commit -m "Polish car removal dialog and controls"
          git pull --rebase origin main
          git push origin HEAD:main
