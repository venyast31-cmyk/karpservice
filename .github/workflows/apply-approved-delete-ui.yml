name: Apply approved car delete UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-approved-delete-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update the Karpservice interface
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_approved_delete_ui.py

      - name: Validate inline JavaScript and UI markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', text, re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/karpservice-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert text.count('id="deleteCarModal"') == 1
          assert text.count('class="delete-car-button"') == 1
          assert 'window.confirm(' not in text
          assert 'class="vehicle-actions"' not in text
          PY
          node --check /tmp/karpservice-inline.js

      - name: Publish approved design and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp/roapp-asset-pages.txt tmp/roapp-delete-asset-docs.txt tmp/roapp-asset-removal-ui.json
          git rm -f .github/workflows/apply-approved-delete-ui.yml
          git rm -f .github/scripts/apply_approved_delete_ui.py
          git add -A
          git commit -m "Polish car removal dialog and controls"
          git pull --rebase origin main
          git push origin HEAD:main
