name: Apply approved car delete UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-approved-delete-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update the Karpservice interface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          # Compact square destructive control on the vehicle card + branded modal.
          old_delete_css = '''  .vehicle-actions{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:10px;align-items:stretch}
  .vehicle-actions button{margin:0}
