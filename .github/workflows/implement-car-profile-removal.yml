async function deleteCarFromProfile(button){
  const carId = Number(button?.dataset?.carId);
  const car = getCar(carId);
  if (!car){
    showStatus('Автомобіль не знайдено. Оновіть список.', 'error', 'carsStatus');
    return;
  }

  const title = carName(car);
  const confirmed = window.confirm(
    `Видалити ${title} зі вкладки «Авто»?\n\nІсторія обслуговування в CRM збережеться. Автомобіль можна буде додати знову за VIN.`
  );
  if (!confirmed) return;

  const originalHtml = button.innerHTML;
  button.disabled = true;
  button.textContent = 'Видаляємо…';
  showStatus('Видаляємо автомобіль із профілю…', 'ok', 'carsStatus');

  try{
    const res = await apiFetch('cars/remove', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({car_id:car.id, vin:car.vin || ''})
    });
    const data = await responseJson(res);

    if (res.status === 401){
      setAuthSession(false);
      clearLegacyAuthToken();
      resetAuthFlow({message:'Сесія завершилася. Підтвердьте вхід через Telegram ще раз.'});
      show('login');
      return;
    }
    if (!res.ok || !data.success){
      throw new Error(readableUiError(data.error || data, 'Не вдалося видалити автомобіль.'));
    }

    const refreshed = await loadCustomer({targetScreen:'cars'});
    if (refreshed){
      showStatus(data.message || 'Автомобіль видалено з профілю.', 'ok', 'carsStatus');
    }
  }catch(err){
    showStatus(err.message || 'Не вдалося видалити автомобіль.', 'error', 'carsStatus');
    console.error(err);
  }finally{
    if (button?.isConnected){
      button.disabled = false;
      button.innerHTML = originalHtml;
    }
  }
}
'''
