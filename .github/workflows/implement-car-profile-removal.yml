name: Implement confirmed car removal from client profile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/implement-car-profile-removal.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add safe car removal to Worker and app
        run: python .github/scripts/implement_car_profile_removal.py

      - name: Run syntax and security tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix worker run check
          npm --prefix worker test
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('inline app script not found')
          Path('/tmp/karpservice-app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/karpservice-app.js
          grep -q 'deleteCarFromProfile' index.html
          grep -q 'cars/remove' worker/src/index.js

      - name: Publish production changes and clean diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf tmp
          git rm -f .github/workflows/implement-car-profile-removal.yml
          git rm -f .github/scripts/implement_car_profile_removal.py
          git add -A
          git commit -m "Add confirmed car removal from client profile"
          git pull --rebase origin main
          git push origin HEAD:main
