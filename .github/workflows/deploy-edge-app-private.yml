name: Deploy Karpservice edge app privately

on:
  push:
    branches:
      - main
    paths:
      - "edge-app/**"
      - ".github/workflows/deploy-edge-app-private.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.127.1

      - name: Deploy temporary account Worker privately
        working-directory: edge-app
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --temporary > ../edge-deploy-private.log 2>&1

          CLAIM_URL="$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[A-Za-z0-9_-]+' ../edge-deploy-private.log | head -n 1)"
          APP_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' ../edge-deploy-private.log | tail -n 1)"

          if [ -z "$CLAIM_URL" ] || [ -z "$APP_URL" ]; then
            echo "Deployment completed without a readable encrypted handoff."
            exit 1
          fi

          printf 'claim_url=%s\napp_url=%s\n' "$CLAIM_URL" "$APP_URL" > /tmp/edge-result.txt
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey claim-public.pem \
            -in /tmp/edge-result.txt \
            -out /tmp/edge-result.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          base64 -w 0 /tmp/edge-result.bin > ../edge-claim.enc
          rm -f ../edge-deploy-private.log /tmp/edge-result.txt /tmp/edge-result.bin

      - name: Store encrypted handoff and remove one-time deployment files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge-claim.enc
          git rm --ignore-unmatch edge-app/claim-public.pem .github/workflows/deploy-edge-app-private.yml
          git commit -m "Store encrypted Karpservice edge deployment handoff"
          git push origin HEAD:main
