name: Inspect Range Rover catalog
on:
  push:
    branches: [release/api]
    paths: [.github/workflows/oem-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node worker/scripts/oem-diagnose.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VINALFA_API_TOKEN: ${{ secrets.VINALFA_API_TOKEN }}
