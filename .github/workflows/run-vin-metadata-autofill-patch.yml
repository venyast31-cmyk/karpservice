name: Run VIN metadata autofill patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-vin-metadata-autofill-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply corrected patch
        run: python scripts/patch-vin-metadata-autofill-v2.py

      - name: Verify Worker and VIN flow
        run: |
          npm --prefix worker run check
          npm --prefix worker test
          grep -Fq 'lookupVehicleIdentityByVin' worker/src/index.js
          grep -Fq 'brand: identity.brand' worker/src/index.js
          grep -Fq 'assert.equal(createAssetCall.body.brand, "Skoda")' worker/test/worker-security.test.mjs

      - name: Publish implementation and clean helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/test/worker-security.test.mjs
          git rm -f tmp/vin-source-summary.json || true
          git rm -f scripts/patch-vin-metadata-autofill.py scripts/patch-vin-metadata-autofill-v2.py
          git rm -f .github/workflows/run-vin-metadata-autofill-patch.yml
          git commit -m "Autofill vehicle make and model from VIN"
          git push origin HEAD:main
