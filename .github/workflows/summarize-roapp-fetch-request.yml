name: Summarize RO App fetch request transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/summarize-roapp-fetch-request.yml"

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract concise module context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('tmp/roapp-fetch-request-context.txt').read_text(encoding='utf-8')
          out = [f'SOURCE_LENGTH={len(source)}']
          markers = [
              '--- module:15268',
              '--- module:61998',
              '--- module:83454',
              '--- literal:fetchRequest',
              '--- literal:baseURL',
              '--- literal:baseUrl',
              '--- literal:apiHost',
              '--- literal:api_url',
              '--- literal:credentials:"include"',
              '--- literal:credentials:"same-origin"',
          ]
          seen = set()
          for marker in markers:
              positions = [match.start() for match in re.finditer(re.escape(marker), source)]
              out.append(f'COUNT {marker} = {len(positions)}')
              for index, position in enumerate(positions[:8], 1):
                  left = max(0, position - 2500)
                  right = min(len(source), position + 35000)
                  snippet = source[left:right]
                  key = snippet[:500]
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append(f'\n===== {marker} #{index} AT {position} =====\n{snippet}')

          # Also capture direct module syntax variants, in case the marker itself was omitted.
          for pattern in [
              r'(?<!\d)15268\s*:\s*function\s*\(',
              r'(?<!\d)61998\s*:\s*function\s*\(',
              r'(?<!\d)83454\s*:\s*function\s*\(',
          ]:
              for index, match in enumerate(re.finditer(pattern, source), 1):
                  if index > 6:
                      break
                  left = max(0, match.start() - 1200)
                  right = min(len(source), match.start() + 42000)
                  out.append(f'\n===== REGEX {pattern} #{index} AT {match.start()} =====\n{source[left:right]}')

          result = '\n'.join(out)
          Path('tmp/roapp-fetch-request-summary.txt').write_text(result[:700000], encoding='utf-8')
          PY

      - name: Publish summary and clean large context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/roapp-fetch-request-summary.txt
          git rm -f tmp/roapp-fetch-request-context.txt
          git rm -f .github/workflows/summarize-roapp-fetch-request.yml
          git rm -f .github/workflows/extract-roapp-request-module.yml || true
          git commit -m "Summarize RO App fetch request transport"
          git push origin HEAD:main
