name: Probe VIN decoders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vin-decoders.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Query public VIN decoders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          vins = ["TMBDX41U79B008586", "JMBSRCS3A6U011108"]
          out = {}

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Karpservice/1.0 VIN decoder compatibility test",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      body = response.read().decode("utf-8", "replace")
                      return {"status": response.status, "data": json.loads(body)}
              except Exception as exc:
                  return {"error": f"{type(exc).__name__}: {exc}"}

          for vin in vins:
              encoded = urllib.parse.quote(vin, safe="")
              out[vin] = {
                  "nhtsa": get_json(
                      f"https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/{encoded}?format=json"
                  ),
                  "vinwhere": get_json(
                      f"https://vinwhere.com/api/v1/decode?vin={encoded}"
                  ),
                  "carwhere": get_json(
                      f"https://www.carwhere.com/api/public/vin/{encoded}"
                  ),
              }

          Path("tmp").mkdir(exist_ok=True)
          Path("tmp/vin-decoder-probe.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY

      - name: Publish probe and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/vin-decoder-probe.json
          git rm -f .github/workflows/probe-vin-decoders.yml
          git commit -m "Record VIN decoder compatibility probe"
          git push origin HEAD:main
